[workspace]
members = ["engine"]
resolver = "3"

[package]
name = "cwlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "Wallet: the general client-side holder that keeps openings and creates proofs"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://github.com/corbet-foss/cwlt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
native-verifier = ["czkp/process", "beacon"]
beacon = ["dep:cbcn"]
schema = ["dep:utoipa", "dep:schemars", "czkp/schema"]
passport = ["dep:cpsd", "dep:ckmg", "dep:cwst", "dep:blake3"]

[dependencies]
data-encoding = "2.9"
cbcn = { git = "https://github.com/corbet-foss/cbcn", branch = "main", optional = true }
ckmg = { git = "https://github.com/corbet-foss/ckmg", branch = "main", default-features = false, features = ["passport"], optional = true }
czkp = { git = "https://github.com/corbet-foss/czkp", branch = "main" }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cpsd = { git = "https://github.com/corbet-foss/cpsd", branch = "main", default-features = false, optional = true }
cwst = { git = "https://github.com/corbet-foss/cwst", branch = "main", optional = true }
blake3 = { version = "1.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
csgn = { git = "https://github.com/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }

# Pairing arithmetic uses upstream optimized implementations. Our own tests
# retain ordinary source instrumentation and no coverage exclusions.
[profile.dev.package."*"]
opt-level = 3
