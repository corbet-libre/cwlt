[workspace]
members = ["engine"]
resolver = "3"

[package]
name = "cwlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Wallet: the general client-side holder that keeps openings and creates proofs"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cwlt"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib", "cdylib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
passport = ["dep:cpsd", "dep:ckmg", "ckmg/passport", "dep:cwst", "dep:blake3"]
record = ["dep:ckmg", "dep:cwst", "dep:czkp", "dep:blake3"]
account = ["dep:ckmg", "dep:cwst", "dep:blake3"]
native-prover = ["account", "ckmg/wallet-native-prover"]
wave = ["dep:czkp"]
native-verifier = ["wave", "dep:cvfy"]
schema = ["wave", "dep:utoipa", "dep:schemars", "czkp/schema"]

[dependencies]
ckmg = { git = "https://git.corbet.ch/corbet-foss/ckmg.git", branch = "v01", default-features = false, features = ["wallet-engine"], optional = true }
cwst = { git = "https://git.corbet.ch/corbet-foss/cwst.git", branch = "v01", optional = true }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main", optional = true }
blake3 = { version = "1.8", optional = true }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cpsd = { git = "https://git.corbet.ch/corbet-foss/cpsd", branch = "main", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvfy = { git = "https://git.corbet.ch/corbet-foss/cvfy.git", branch = "main", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[dev-dependencies]
ed25519-dalek = "3.0"
futures = { version = "0.3", features = ["executor"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
csgn = { git = "https://git.corbet.ch/corbet-foss/csgn", branch = "main", default-features = false, features = ["volatile-signer"] }

# Pairing arithmetic uses upstream optimized implementations. Our own tests
# retain ordinary source instrumentation and no coverage exclusions.
[profile.dev.package."*"]
opt-level = 3
