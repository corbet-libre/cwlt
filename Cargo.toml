[workspace]
members = ["engine", "wasm"]
# Workspace-wide by default: `cargo llvm-cov report` takes no --workspace and selects the default members, so without
# this the LCOV export lacks the engine and wasm members that the instrumented run (--workspace) covers.
default-members = [".", "engine", "wasm"]
resolver = "3"

[package]
name = "cwlt"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Wallet: the general client-side holder that keeps openings and creates proofs"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cwlt.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
default = []
passport = ["dep:cpsd", "dep:ckmg", "ckmg/passport", "dep:cwst", "dep:blake3"]
record = ["dep:ckmg", "dep:cwst", "dep:blake3"]
account = ["dep:ckmg", "dep:cwst", "dep:blake3"]
native-prover = ["account", "ckmg/wallet-native-prover"]
browser-prover = ["account", "ckmg/wallet-browser-prover"]
wave = []
beacon = ["wave", "dep:cbcn"]
native-verifier = ["wave", "dep:cvfy"]
schema = ["wave", "dep:utoipa", "dep:schemars", "czkp/schema"]

[dependencies]
# Same git source as ckmg's engine (one selected package): .github/engine_identity.py proves its bytes equal engine/ and forbids a path edge.
cwlt-engine = { git = "https://git.corbet.ch/corbet-libre/cwlt.git", branch = "main" }
ckmg = { git = "https://git.corbet.ch/corbet-libre/ckmg.git", branch = "main", default-features = false, features = ["wallet-engine"], optional = true }
cwst = { git = "https://git.corbet.ch/corbet-libre/cwst.git", branch = "main", optional = true }
cbcn = { git = "https://git.corbet.ch/corbet-libre/cbcn.git", branch = "main", optional = true }
czkp = { git = "https://git.corbet.ch/corbet-libre/czkp.git", branch = "main" }
blake3 = { version = "1.8", optional = true }
utoipa = { version = "6", optional = true }
schemars = { version = "1", optional = true }
cpsd = { git = "https://git.corbet.ch/corbet-libre/cpsd.git", branch = "main", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cvfy = { git = "https://git.corbet.ch/corbet-libre/cvfy.git", branch = "main", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-libre/czkp.git", branch = "main", features = ["reference"] }
ed25519-dalek = "3.0"
futures = { version = "0.3", features = ["executor"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
csgn = { git = "https://git.corbet.ch/corbet-libre/csgn.git", branch = "main", default-features = false, features = ["volatile-signer"] }
