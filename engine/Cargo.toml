[package]
name = "cwlt-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Internal opaque Wallet witness engine"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-foss/cwlt"
publish = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[features]
native-prover = ["dep:acvm", "dep:noirc_abi", "dep:noirc_artifacts", "dep:nargo", "dep:bn254_blackbox_solver", "dep:barretenberg-rs", "dep:rlimit", "dep:data-encoding", "dep:flate2"]

[dependencies]
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main" }
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "x25519", "chacha"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rs_merkle = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", default-features = false, features = ["bn254"], optional = true }
noirc_abi = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", optional = true }
noirc_artifacts = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", optional = true }
nargo = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", default-features = false, optional = true }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.26", optional = true }
barretenberg-rs = { version = "5.2.1", default-features = false, features = ["ffi"], optional = true }
rlimit = { version = "0.11", optional = true }
data-encoding = { version = "2.9", optional = true }
flate2 = { version = "1", optional = true }

[[example]]
name = "cwlt-account-worker"
path = "examples/account_worker.rs"
required-features = ["native-prover"]

[dev-dependencies]
czkp = { git = "https://git.corbet.ch/corbet-foss/czkp", branch = "main", features = ["reference"] }
rand_chacha = "0.10"
rand_core = "0.10"
sha2 = "0.11"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
